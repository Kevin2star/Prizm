server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

gemini:
  api-key: ${GEMINI_API_KEY:}
  tag-model: ${GEMINI_TAG_MODEL:gemini-2.5-flash}
  embed-model: ${GEMINI_EMBED_MODEL:gemini-embedding-001}

prizm:
  similarity-threshold: ${SIMILARITY_THRESHOLD:0.75}
  demo-seed: ${DEMO_SEED:true}
